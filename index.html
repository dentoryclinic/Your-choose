<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.line-scdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.line-scdn.net https://*.line-apps.com; connect-src https://api.line.me https://*.line.me https://*.line-scdn.net https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>เลือกสียางจัดฟัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Prompt:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile column (max 480px) on a pastel-sky ground with soft blobs; sticky pill action bar at the bottom.
   Single light look by design (Dentory poster palette), so colours are set explicitly for every host theme. */
:root{
  color-scheme:light;
  --sky-100:#d6ebfc; --sky-200:#b0defc; --surface:#ffffff; --lilac-100:#e2e2fc; --pink-100:#f8d0e4;
  --ink:#0b1677; --ink-muted:#4a5394; --pink-500:#fc5490; --pink-400:#fc66a2; --pink-600:#d42f70;
  --blue-300:#56aafc; --blue-600:#0b5ffc; --violet-500:#7a30f8; --violet-400:#9a40f8;
  --coral:#f86048; --title-blue:#40a8f8; --line-green:#06c755; --gold:#fed34b;
  --field:#f4f9fe; --rule:#c9c3f0; --num:#8a90b8;
  --shadow-card:0 8px 24px rgba(43,123,248,.14); --shadow-pink:0 8px 20px rgba(252,84,144,.32);
  --font-display:Kanit,Prompt,"Noto Sans Thai",system-ui,sans-serif;
  --font-body:Prompt,Kanit,"Noto Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sky-100)}
body{margin:0;background:var(--sky-100);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet-500);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.blobs i{position:absolute;border-radius:50%}
.blobs i:nth-child(1){top:-90px;right:-110px;width:300px;height:300px;background:var(--sky-200)}
.blobs i:nth-child(2){top:300px;left:-140px;width:260px;height:260px;background:var(--lilac-100);opacity:.7}
.blobs i:nth-child(3){bottom:-120px;right:-80px;width:280px;height:280px;background:var(--pink-100);opacity:.6}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
.k{font-family:var(--font-display)}
.muted{color:var(--ink-muted)}
.heart{color:var(--pink-500)}
.card{background:var(--surface);border-radius:28px;box-shadow:var(--shadow-card)}
.sparkle{position:absolute;pointer-events:none}

/* splash */
.splash{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:36px;text-align:center}
.splash .logo{width:120px;height:auto;display:block}
.tagrow{display:inline-flex;align-items:center;gap:8px;transform:rotate(-3deg)}
.pill-explore{background:var(--pink-500);color:#fff;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;padding:8px 18px;border-radius:9999px;box-shadow:var(--shadow-pink)}
.tagrow .en{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--blue-600)}
.rainbow{display:grid;margin-top:4px}
.rainbow > *{grid-area:1/1;margin:0;font-family:var(--font-display);font-weight:800;font-size:60px;line-height:1.1}
.rainbow .stroke{color:#fff;-webkit-text-stroke:12px #fff}
.rainbow h1{background:linear-gradient(90deg,var(--coral) 0%,var(--pink-500) 35%,var(--violet-400) 68%,var(--title-blue) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;font-family:var(--font-display);font-weight:600;font-size:20px}
.bubble{position:relative;padding:16px 20px;text-align:left;width:100%}
.bubble p{margin:0;font-size:16px;line-height:1.6}
.bubble::after{content:"";position:absolute;bottom:-10px;left:44px;width:22px;height:22px;background:var(--surface);transform:rotate(45deg);border-radius:4px}
.twostep{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.twostep > p{margin:0;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.2}
.twostep > p b{color:var(--pink-500);font-size:48px;vertical-align:-6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile .n{width:56px;height:56px;border-radius:9999px;color:#fff;font-family:var(--font-display);font-weight:800;font-size:40px;line-height:56px;text-align:center}
.tile .t{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.3}
.tile .d{font-size:14px;color:var(--ink-muted);line-height:1.4}
.contacts{width:100%;display:flex;flex-direction:column;gap:10px}
.contact{display:flex;align-items:center;gap:12px;min-height:52px;background:var(--surface);border-radius:9999px;padding:8px 18px 8px 8px;text-decoration:none;color:var(--blue-600);font-weight:600;font-size:16px;box-shadow:var(--shadow-card);text-align:left}
.contact .ic{width:36px;height:36px;flex-shrink:0;border-radius:9999px;background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center}
.contact .ic.line{background:var(--line-green)}
.contact span:last-child{user-select:text}
.qrcard{width:100%;padding:16px;display:flex;align-items:center;gap:16px;text-align:left}
.qrcard img{width:104px;height:104px;flex-shrink:0;border-radius:16px;background:#fff;border:2px solid var(--sky-100)}
.qrcard .t{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.3}
.qrcard .d{font-size:14px;color:var(--ink-muted);line-height:1.45}

/* bottom bars */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--sky-100) 65%,rgba(214,235,252,0))}
.bottom > *{max-width:448px;margin:0 auto}
.cta{width:100%;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;border:none;border-radius:9999px;background:var(--pink-500);color:#fff;font-family:var(--font-display);font-weight:600;font-size:26px;box-shadow:var(--shadow-pink)}
.cta:active,.submit:active{transform:scale(.98)}
.pickbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:9999px;padding:8px;box-shadow:0 8px 24px rgba(43,123,248,.2)}
.pickbar .used{display:flex;align-items:center;gap:8px;padding-left:10px}
.pickbar .dots{display:flex}
.pickbar .lbl{font-family:var(--font-display);font-weight:600;font-size:14px;white-space:nowrap}
.submit{flex:1;min-height:52px;border:none;border-radius:9999px;background:var(--pink-500);color:#fff;font-family:var(--font-display);font-weight:600;font-size:24px;box-shadow:var(--shadow-pink);transition:opacity .15s ease}
.submit.off{opacity:.8;background:var(--pink-400)}

/* topbar + steps */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.topbar .b{display:flex;align-items:center;gap:10px;min-width:0}
.topbar img{height:40px;width:auto;display:block}
.topbar .tt{display:flex;flex-direction:column;line-height:1.2}
.topbar .tt b{font-family:var(--font-display);font-weight:700;font-size:18px}
.topbar .tt span{font-size:12px;color:var(--ink-muted)}
.lockpill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:none;border-radius:9999px;background:var(--surface);color:var(--ink-muted);font-size:13px;box-shadow:0 4px 12px rgba(43,123,248,.14);flex-shrink:0}
.steps{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin:6px 0 16px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;width:78px}
.step .dot{width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;background:rgba(255,255,255,.55);color:var(--ink-muted);transition:transform .2s ease}
.step.done .dot{background:#fff;color:var(--blue-600)}
.step.active .dot{color:#fff;box-shadow:0 0 0 4px #fff,0 8px 20px rgba(252,84,144,.25);transform:scale(1.08)}
.step .l{font-size:12px;white-space:nowrap;color:var(--ink-muted)}
.step.active .l{font-family:var(--font-display);font-weight:600;color:var(--ink)}
.stepline{width:22px;height:3px;border-radius:3px;background:var(--sky-200);margin-top:16px}

/* mouth */
.mouth{padding:16px;display:flex;flex-direction:column;gap:10px}
.mouth .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mouth .head b{font-family:var(--font-display);font-weight:600;font-size:18px}
.btn-soft{min-height:36px;padding:0 12px;border:none;border-radius:9999px;background:var(--pink-100);color:var(--pink-600);font-weight:600;font-size:13px}
.fillall{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:2px dashed var(--pink-400);border-radius:9999px;background:#fff5fa;color:var(--pink-600);font-family:var(--font-display);font-weight:600;font-size:15px;padding:0 12px}
.archlbl{font-size:13px;color:var(--ink-muted);padding-left:6px}
.arch{display:flex;justify-content:center;gap:2px;padding:12px 6px 18px}
.arch.up{background:linear-gradient(to bottom,#e9779f 0px,#f39bbd 14px,#f8d0e4 46px,#fde9f2 100%);border-radius:28px 28px 40px 40px;align-items:flex-start}
.arch.lo{background:linear-gradient(to top,#e9779f 0px,#f39bbd 14px,#f8d0e4 46px,#fde9f2 100%);border-radius:40px 40px 28px 28px;padding:18px 6px 12px;align-items:flex-end}
.tooth{position:relative;flex:0 1 35px;min-width:0;width:35px;height:44px;padding:0;background:transparent;border:none;transition:transform .12s ease}
.arch.lo .tooth{height:42px}
.tooth.ro{cursor:default}
.tooth svg.en{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px rgba(11,22,119,.18))}
.tooth .gum{position:absolute;z-index:0;left:-2px;right:-2px;height:14px}
.arch.up .gum{top:-6px;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(to bottom,#e9779f,#f39bbd);box-shadow:0 2px 3px rgba(185,40,100,.18)}
.arch.lo .gum{bottom:-6px;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(to top,#e9779f,#f39bbd);box-shadow:0 -2px 3px rgba(185,40,100,.18)}
.tooth .wire{position:absolute;z-index:1;left:-2px;right:-2px;top:calc(50% - 1.5px);height:3px;border-radius:2px;background:linear-gradient(to bottom,#d4d6dc,#868993)}
.tooth .tie{position:absolute;z-index:2;left:50%;top:calc(50% - 11px);width:24px;height:22px;margin-left:-12px;border-radius:9px;border:5px solid;box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.45)}
.tooth .br{position:absolute;z-index:3;left:50%;top:calc(50% - 7px);width:15px;height:14px;margin-left:-7.5px;border-radius:4px;border:1.5px solid #6e717b;background:linear-gradient(160deg,#fbfbfc 0%,#d7d8dd 45%,#a6a9b2 100%);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tooth .br::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:3px;margin-top:-1.5px;border-radius:1px;background:#8a8d96}
.tooth .num{position:absolute;bottom:-7px;right:-4px;z-index:5;background:var(--ink);color:#fff;font-family:var(--font-display);font-size:10px;font-weight:600;line-height:15px;border-radius:9999px;padding:0 4px}
.mouth .hint{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--ink-muted);text-align:center}

/* palette */
.pick{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.pick .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pick h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.2}
.sticker{background:var(--surface);font-family:var(--font-display);font-weight:600;font-size:13px;padding:6px 12px;border-radius:9999px;transform:rotate(3deg);box-shadow:0 4px 12px rgba(43,123,248,.14);white-space:nowrap}
.hintbar{background:var(--lilac-100);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.45}
.themes{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.themes .tt{display:flex;flex-direction:column;gap:2px}
.themes .tt b{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.3}
.themes .tt span{font-size:12px;color:var(--ink-muted)}
.themehead{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border:2px solid #fff;border-radius:18px;background:rgba(255,255,255,.7);text-align:left;transition:background .15s ease,box-shadow .15s ease}
.themehead.open{border-color:var(--pink-600);background:#fff0f6;box-shadow:var(--shadow-pink)}
.themehead .gdots{display:flex;flex-shrink:0}
.themehead .gdots .gd{width:22px;height:22px;border-radius:9999px;border:2px solid #fff;box-shadow:0 2px 6px rgba(11,22,119,.18)}
.themehead .gdots .gd + .gd{margin-left:-8px}
.themehead .gname{flex:1;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink)}
.themehead .gnew{display:inline-block;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:9999px;background:var(--coral);color:#fff;font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.03em;box-shadow:0 2px 6px rgba(248,96,72,.35)}
.themehead .gchev{flex-shrink:0;display:flex;transition:transform .2s ease}
.themehead.open .gchev{transform:rotate(90deg)}
@media (hover:hover){.themehead:not(.open):hover{background:#f6f8ff}}
.themerow{display:flex;gap:10px;overflow-x:auto;margin:0 -8px;padding:2px 8px 4px;scrollbar-width:none}
.themerow::-webkit-scrollbar{display:none}
.theme{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border:2px solid #fff;border-radius:18px;background:rgba(255,255,255,.7);min-width:74px;transition:background .15s ease,box-shadow .15s ease,opacity .15s ease}
.theme.active{border-color:var(--pink-600);background:#fff0f6;box-shadow:var(--shadow-pink)}
.theme.locked{opacity:.35}
.theme .duo{display:flex;align-items:center;min-height:22px}
.theme .duo .md{flex-shrink:0;width:18px;height:18px;border-radius:9999px;border:2px solid #fff;box-shadow:0 2px 4px rgba(11,22,119,.18)}
.theme .duo .mdmore{font-size:10px;font-weight:700;color:var(--ink-muted);margin-left:4px}
.theme .tn{font-family:var(--font-display);font-weight:600;font-size:12px;white-space:nowrap}
@media (hover:hover){.theme:not(.locked):not(.active):hover{background:#f6f8ff}}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:40px;padding:0 16px;border-radius:9999px;font-family:var(--font-display);font-weight:600;font-size:14px;white-space:nowrap;border:2px solid #fff;background:rgba(255,255,255,.7);color:var(--ink)}
.chip.on{border-color:var(--pink-600);background:var(--pink-600);color:#fff;box-shadow:var(--shadow-pink)}
.err{margin:0;font-size:14px;color:var(--pink-600);font-weight:600}
.swcard{padding:6px 8px 14px}
.rule{height:1px;background:var(--rule);margin:12px 8px 8px}
.rule.b{margin:10px 8px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 2px}
.sw{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:10px 2px 8px;border:none;border-radius:16px;background:transparent;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .15s ease,box-shadow .15s ease,opacity .15s ease}
.sw .no{font-size:11px;letter-spacing:.14em;color:var(--num);line-height:1;font-variant-numeric:tabular-nums}
.sw svg{display:block;overflow:visible;max-width:100%;height:auto}
.sw .nm{max-width:100%;font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.08em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw.armed{background:#fff0f6;box-shadow:0 0 0 2px var(--pink-500),0 8px 20px rgba(252,84,144,.25)}
.sw.editing{background:#f3eeff;box-shadow:0 0 0 2px var(--violet-500)}
.sw.locked{opacity:.3;cursor:not-allowed}
.sw .cnt,.sw .low,.sw .chg{position:absolute;top:2px;min-width:20px;height:20px;padding:0 4px;border-radius:9999px;font-family:var(--font-display);font-size:11px;font-weight:700;line-height:20px;text-align:center}
.sw .cnt{right:4px;background:var(--pink-600);color:#fff;box-shadow:0 0 0 2px #fff}
.sw .low{left:4px;background:var(--gold);color:var(--ink)}
.sw .chg{right:4px;background:var(--violet-500);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.sw .oos{position:absolute;inset:0;border-radius:16px;background:rgba(255,255,255,.78);color:var(--pink-600);font-family:var(--font-display);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
@media (hover:hover){.sw:not(.locked):not(.armed):hover{background:#f6f8ff}}
.charttoggle{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;margin-top:8px;border:2px solid #fff;border-radius:9999px;background:rgba(255,255,255,.6);color:var(--blue-600);font-weight:600;font-size:15px;padding:0 14px}
.chart img{width:100%;height:auto;display:block;border-radius:28px;border:6px solid #fff;box-shadow:var(--shadow-card)}
.chart p{margin:8px 0 0;font-size:13px;color:var(--ink-muted);line-height:1.5}

/* forms */
.form{padding:24px 20px;display:flex;flex-direction:column;gap:16px;margin-top:16px}
.fhead{display:flex;align-items:center;gap:10px}
.disc{width:40px;height:40px;flex-shrink:0;border-radius:9999px;background:var(--lilac-100);color:var(--violet-500);display:flex;align-items:center;justify-content:center}
.fhead .tt{display:flex;flex-direction:column;line-height:1.25}
.fhead .tt b{font-family:var(--font-display);font-weight:600;font-size:20px}
.fhead .tt span{font-size:13px;color:var(--ink-muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--font-display);font-weight:600;font-size:14px}
.field label small{font-family:var(--font-body);font-weight:400;font-size:14px;color:var(--ink-muted)}
.req{color:var(--pink-600)}
.inp{height:50px;padding:0 18px;border:2px solid var(--sky-100);border-radius:9999px;background:var(--field);color:var(--ink);font-size:16px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:84px;padding:14px 18px;border-radius:24px;resize:vertical}
select.inp{padding:0 16px}
.inp:focus{outline:none;border-color:var(--blue-300);background:#fff}
.ferr{font-size:13px;color:var(--pink-600);padding-left:12px}

/* confirm */
.done{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:4px 0 18px}
.done .badge{width:72px;height:72px;border-radius:9999px;background:var(--pink-500);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-pink)}
.done h2{margin:4px 0 0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.2}
.done p{margin:0;color:var(--ink-muted)}
.conf{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.summary{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.summary .row{display:flex;align-items:center;gap:12px}
.summary .row b{font-family:var(--font-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.summary .appt{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:2px dashed var(--sky-100)}
.pinkbox{background:var(--pink-100);border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.pinkbox p{margin:0;font-size:15px;line-height:1.6}

.howto{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

.sentnote{margin:0;background:#fff;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.55;color:var(--ink)}

.hrow2{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}

function hexToHSL(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,s=0,l=(max+min)/2;
  if(max!==min){var d=max-min;s=l>.5?d/(2-max-min):d/(max+min);

  return {h:h,s:s*100,l:l*100};
}
function familyParts(hex){
  var p=hexToHSL(hex),h=p.h,s=p.s,l=p.l;
  if(s<12){ if(l<22) return ["ดำ",""]; if(l>85) return ["ขาว",""]; return ["เทา",""]; }

function placeOn(arch,i,n){

function tapTooth(arch,i){
  var arr=S[arch];
  if(S.armed!=null){ if(arr[i]===S.armed) arr[i]=null; else placeOn(arch,i,S.armed); }
  else if(arr[i]!=null){ arr[i]=null; S.paletteError=""; }

function submit(){
  if(!used().length){ S.submitError="ยังไม่ได้แปะสีบนฟันเลยนะคะ"; render(); return; }
  if(S.phone.trim() && !isThaiPhone(S.phone)){ S.phoneError="เบอร์ดูไม่ครบ ลองเช็กอีกทีนะคะ"; render(); return; }
  var changed=false;
  used().forEach(function(n){ var x=stockOf(n); if(x!==null){ S.stock[n]=Math.max(0,x-countOf(n)); changed=true; } });
  if(changed) persist();
  S.sent=false;
  go("confirm",{submitError:"",armed:null,pinOpen:false,lineTapped:false,saveState:HISTORY_ON?"saving":""});
  if(HISTORY_ON) saveToClinic(); else sendViaLiff();
}
function api(action, data){
  var body={action:action}; for(var k in data) body[k]=data[k];
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function(){ ctl.abort(); }, 15000) : null;
  return fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined,redirect:"follow"})
    .then(function(r){ if(tm) clearTimeout(tm); return r.json(); });
}
function saveToClinic(){
  var u=used();
  api("save",{name:S.name.trim()||LIFF_NAME,phone:S.phone.trim(),apptDate:S.apptDate,note:S.note.trim(),
    upper:S.upper,lower:S.lower,colorNames:u.map(function(n){return cname(n);}),idToken:S.idToken})
    .then(function(r){
      if(!r||!r.ok) throw new Error(r&&r.error||"fail");
      S.saveState="saved";
      sendViaLiff();
      var v={date:"วันนี้",colors:u.slice(),upper:S.upper.slice(),lower:S.lower.slice()};
      if(S.idToken){ S.history=[v].concat(S.history||[]); }
      render();
    }).catch(function(){ S.saveState="failed"; render(); sendViaLiff(); });
}

var pinFails = 0, pinLockUntil = 0;
function sha256hex(str){
  if(!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error("no-crypto"));
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
  });
}
function submitPin(){
  var box=document.getElementById("pinBox"), v=box?String(box.value).trim():"";
  var now=Date.now();
  if(now<pinLockUntil){ S.pinError="ใส่ผิดหลายครั้ง รออีก "+Math.ceil((pinLockUntil-now)/1000)+" วินาทีค่ะ"; render(); return; }
  if(HISTORY_ON){
    S.pinError="กำลังตรวจรหัส..."; render();
    api("staff",{pin:v,q:""}).then(function(r){
      if(r&&r.ok){ pinFails=0; S.staffPin=v; S.staffData=r; go("staff",{pinOpen:false,pinError:"",staffQ:"",staffError:""}); return; }
      if(r&&r.error==="locked"){ S.pinError="ใส่ผิดหลายครั้ง ระบบล็อกไว้ 10 นาทีค่ะ"; render(); return; }
      if(r&&r.error==="no_pin_set"){ S.pinError="ยังไม่ได้ตั้ง STAFF_PIN ใน Apps Script"; render(); return; }
      S.pinError="รหัสไม่ถูกต้อง ลองใหม่อีกครั้งค่ะ"; render();
    }).catch(function(){
      sha256hex(v).then(function(h){
        if(h===STAFF_PIN_SHA256){ S.staffPin=v; go("staff",{pinOpen:false,pinError:"",staffError:"เชื่อมต่อ Google Sheet ไม่ได้ ตอนนี้ดูประวัติไม่ได้ค่ะ"}); }
        else { S.pinError="รหัสไม่ถูกต้อง ลองใหม่อีกครั้งค่ะ"; render(); }
      }, function(){ S.pinError="เชื่อมต่อไม่ได้ ลองใหม่ค่ะ"; render(); });
    });
    return;
  }
  sha256hex(v).then(function(h){
    if(h===STAFF_PIN_SHA256){ pinFails=0; go("staff",{pinOpen:false,pinError:""}); return; }
    pinFails++;
    if(pinFails>=5){ pinFails=0; pinLockUntil=Date.now()+60000; S.pinError="ใส่ผิด 5 ครั้ง ล็อก 1 นาทีค่ะ"; }
    else S.pinError="รหัสไม่ถูกต้อง ลองใหม่อีกครั้งค่ะ";
    render();
  }, function(){ S.pinError="เครื่องนี้เปิดหน้าพนักงานไม่ได้ ลองใช้เบราว์เซอร์อื่นค่ะ"; render(); });
}
function saveEdit(){
  var n=S.edit; if(n==null) return;
  var hex=String(document.getElementById("eHex").value||"").trim().toLowerCase();
  if(hex && hex.charAt(0)!=="#") hex="#"+hex;
  if(!isHex(hex)){ S.eError="รหัสสีต้องเป็นแบบ #a1b2c3 นะคะ"; S.eSaved=false; render(); return; }
  var stockStr=String(document.getElementById("eStock").value).trim();
  if(stockStr!=="" && (isNaN(Number(stockStr))||Number(stockStr)<0)){ S.eError="จำนวนสต็อกต้องเป็นเลข 0 ขึ้นไปค่ะ"; S.eSaved=false; render(); return; }
  var catSel=document.getElementById("eCat").value, c=catSel==="__custom__"?String(document.getElementById("eCatCustom").value||"").trim():catSel;
  if(catSel==="__custom__" && !c){ S.eError="พิมพ์ชื่อหมวดใหม่ หรือเลือกหมวดที่มีอยู่แล้วนะคะ"; S.eSaved=false; render(); return; }
  var hex2=null, h2el=document.getElementById("eHex2");
  if(h2el){ hex2=String(h2el.value||"").trim().toLowerCase(); if(hex2&&hex2.charAt(0)!=="#") hex2="#"+hex2;
    if(!isHex(hex2)){ S.eError="รหัสสีที่ 2 ต้องเป็นแบบ #a1b2c3 นะคะ"; S.eSaved=false; render(); return; } }
  if(hex!==COLORS[n]) S.ovColor[n]=hex; else delete S.ovColor[n];
  if(hex2 && hex2!==TWO_TONE[n][1]) S.ovColor2[n]=hex2; else delete S.ovColor2[n];
  var nm=String(document.getElementById("eName").value||"").trim();
  var fp=familyParts(hex), autoName=NAME_BASE[n]||(fp[0]+fp[1]);
  if(nm && nm!==autoName) S.ovName[n]=nm; else delete S.ovName[n];
  if(c) S.ovCat[n]=c; else delete S.ovCat[n];
  if(stockStr==="") delete S.stock[n]; else S.stock[n]=Math.floor(Number(stockStr));
  persist(); S.eError=""; S.eSaved=true; render();
}
function resetEdit(){
  var n=S.edit; if(n==null) return;
  delete S.ovColor[n]; delete S.ovColor2[n]; delete S.ovName[n]; delete S.ovCat[n]; delete S.stock[n];
  persist(); S.eError=""; S.eSaved=true; render();
}

/* ---------- events ---------- */
app.addEventListener("click", function(e){
  var sw = e.target.closest("[data-swatch]");
  if(sw){ pickSwatch(parseInt(sw.getAttribute("data-swatch"),10)); return; }
  var el = e.target.closest("[data-act]"); if(!el) return;
  var a = el.getAttribute("data-act");
  switch(a){
    case "start": go("pick"); break;
    case "tooth": tapTooth(el.getAttribute("data-arch"), parseInt(el.getAttribute("data-idx"),10)); break;
    case "clearAll": S.upper=emptyArch(); S.lower=emptyArch(); S.paletteError=""; render(); break;
    case "fillAll": if(S.armed!=null){ var arr=[]; for(var i=0;i<TEETH;i++) arr.push(S.armed); S.upper=arr.slice(); S.lower=arr.slice(); S.paletteError=""; render(); } break;
    case "theme": applyTheme(el.getAttribute("data-g"), parseInt(el.getAttribute("data-i"),10)); break;
    case "themeGroup": { var gk=el.getAttribute("data-g"); S.themeOpen = (S.themeOpen===gk?null:gk); render(); } break;
    case "filter": S.filter=el.getAttribute("data-v"); render(); break;
    case "chart": S.chartOpen=!S.chartOpen; render(); break;
    case "submit": submit(); break;
    case "useHist": useHist(parseInt(el.getAttribute("data-i"),10)); break;
    case "myHist": go("myhist",{histSel:0}); break;
    case "histSel": S.histSel=parseInt(el.getAttribute("data-i"),10); render(); break;
    case "staffSearch": { var qq=document.getElementById("staffQ"); staffLoad(qq?qq.value.trim():""); } break;
    case "lineTap": setTimeout(function(){ S.lineTapped=true; render(); }, 400); break;
    case "redo": go("pick",{upper:emptyArch(),lower:emptyArch(),armed:null,submitError:"",paletteError:""}); break;
    case "home": goHome(); break;
    case "openPin": S.pinOpen=true; S.pinError=""; render(); break;
    case "cancelPin": S.pinOpen=false; S.pinError=""; render(); break;
    case "overlay": if(e.target===el){ S.pinOpen=false; S.pinError=""; render(); } break;
    case "submitPin": submitPin(); break;
    case "backToPick": go("pick"); break;
    case "openColors": go("staffColors",{edit:null,eError:"",eSaved:false}); break;
    case "backToStaff": go("staff",{edit:null}); break;
    case "editColor": S.edit=parseInt(el.getAttribute("data-n"),10); S.eError=""; S.eSaved=false; render(); var ec=document.getElementById("editCard"); if(ec) ec.scrollIntoView({block:"start",behavior:"smooth"}); break;
    case "saveEdit": saveEdit(); break;
    case "resetEdit": resetEdit(); break;
    case "closeEdit": S.edit=null; S.eError=""; render(); break;
  }
});
app.addEventListener("input", function(e){
  var t=e.target, id=t.id;
  if(id==="fName"){ S.name=t.value; S.submitError=""; syncSubmit(); }
  else if(id==="fPhone"){ S.phone=t.value; if(S.phoneError && (!t.value.trim()||isThaiPhone(t.value))){ S.phoneError=""; var pe=document.getElementById("phoneErr"); if(pe) pe.remove(); } syncSubmit(); }
  else if(id==="fNote"){ S.note=t.value; }
  else if(id==="fDate"){ S.apptDate=t.value; }
  else if(id==="ePicker"||id==="ePicker2"){ document.getElementById(id==="ePicker"?"eHex":"eHex2").value=t.value; paintBig(); }
  else if(id==="eHex"||id==="eHex2"){ var v=t.value.trim(); if(v&&v[0]!=="#") v="#"+v; if(isHex(v)){ document.getElementById(id==="eHex"?"ePicker":"ePicker2").value=v.toLowerCase(); paintBig(); } }
});
app.addEventListener("change", function(e){
  var t=e.target;
  if(t.id==="fDate") S.apptDate=t.value;
  if(t.id==="eCat"){ var c=document.getElementById("eCatCustom"); c.hidden = t.value!=="__custom__"; if(!c.hidden) c.focus(); }
});
app.addEventListener("focusout", function(e){
  if(e.target.id==="fPhone"){
    var v=e.target.value, err=(v.trim()&&!isThaiPhone(v))?"เบอร์ดูไม่ครบ ลองเช็กอีกทีนะคะ":"";
    if(err!==S.phoneError){ S.phoneError=err; var rel=e.relatedTarget; render(); if(rel&&rel.id){ var r=document.getElementById(rel.id); if(r) r.focus(); } }
  }
});
app.addEventListener("keydown", function(e){
  if(e.target.id==="pinBox" && e.key==="Enter"){ e.preventDefault(); submitPin(); }
  if(e.target.id==="staffQ" && e.key==="Enter"){ e.preventDefault(); staffLoad(e.target.value.trim()); }
  if(e.key==="Escape" && S.pinOpen){ S.pinOpen=false; render(); }
});
app.addEventListener("submit", function(e){ e.preventDefault(); });
function paintBig(){
  var a=document.getElementById("ePicker"), b=document.getElementById("ePicker2"), big=document.getElementById("bigSw");
  if(a&&big) big.style.background = b ? "linear-gradient(135deg,"+a.value+" 50%,"+b.value+" 50%)" : a.value;
}
function syncSubmit(){
  var b=document.getElementById("submitBtn"); if(!b) return;
  var ok=canSubmit(); b.classList.toggle("off",!ok); b.setAttribute("aria-disabled",String(!ok)); b.textContent=submitLabel();
}

/* ---------- idle reset (kiosk only, #kiosk): back to splash after 90 s on pick/confirm ---------- */
var idleTimer = null;
function resetIdle(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
  if(KIOSK && (S.view==="pick"||S.view==="confirm") && !S.pinOpen) idleTimer=setTimeout(goHome, IDLE_MS);
}
["pointerdown","keydown","input","scroll"].forEach(function(t){ document.addEventListener(t, resetIdle, {passive:true}); });

render();
if(window.liff){
  liff.init({liffId:LIFF_ID}).then(function(){
    LIFF_READY=true;
    if(liff.isLoggedIn()){
      try{ S.idToken = liff.getIDToken() || ""; }catch(e){ S.idToken=""; }
      loadMyHistory();
      return liff.getProfile().then(function(p){
        LIFF_NAME=p.displayName||"";
        if(!S.name.trim()) S.name=LIFF_NAME;
        render();
      });
    }
  }).catch(function(){});
}
})();
</script>
